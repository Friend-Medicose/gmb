<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GMB PHARMA - Admin</title>
<style>
*{box-sizing:border-box} body{font-family:Arial;margin:0;background:#f4f6f8;color:#222}
.wrap{max-width:1100px;margin:auto;padding:15px}
h1{text-align:center;color:#0b3d91;margin:5px 0} .sub{text-align:center;color:#666;font-size:13px;margin-bottom:15px}
.box{background:#fff;border:2px solid #0b3d91;border-radius:10px;padding:15px;margin-bottom:15px}
.box h2{margin:0 0 12px;color:#0b3d91;font-size:18px;border-bottom:1px solid #ddd;padding-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row>*{flex:1;min-width:140px} label{font-size:12px;color:#555;display:block;margin-bottom:2px}
input,select{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;font-size:14px}
.btn{border:0;padding:10px 16px;border-radius:6px;color:#fff;font-weight:bold;cursor:pointer;font-size:13px}
.g{background:#1a7a2e} .g2{background:#0b3d91} .o{background:#ff6600} .r{background:#d32f2f}
table{width:100%;border-collapse:collapse;font-size:13px} th{background:#0b3d91;color:#fff;padding:8px;text-align:left} td{padding:8px;border-bottom:1px solid #ddd}
.stock-item{background:#eef4ff;padding:8px;border-radius:6px;margin:4px 0;font-size:13px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="wrap">
<h1>GMB PHARMA KARACHI PAKISTAN</h1><div class="sub">Admin Panel - Where good health begins | 0345-0707464</div>

<div class="box"><h2>Total Stock Entry</h2>
<div class="row">
<div><label>Select Product</label><select id="stockProd"></select></div>
<div><label>Stock Qty</label><input id="stockQty" type="number" placeholder="Stock Qty"></div>
<div><label>MRP</label><input id="stockMRP" type="number" placeholder="MRP"></div>
<div><label>TP</label><input id="stockTP" type="number" placeholder="TP"></div>
</div>
<button class="btn g" onclick="addStock()">+ Add Stock</button>
<button class="btn g2" onclick="editStock()">Edit Stock</button>
<button class="btn o" onclick="window.print()">Print Stock</button>
</div>

<div class="box"><h2>Customer Details Entry</h2>
<div class="row">
<div><label>Invoice No:</label><input id="invNo" value="001"></div>
<div><label>Date:</label><input id="invDate" type="date" value="2026-10-19"></div>
<div><label>Customer Code:</label><input id="custCode" placeholder="Customer Code"></div>
<div><label>Customer Name:</label><input id="custName" placeholder="Customer Name"></div>
</div>
<div class="row">
<div><label>Address:</label><input id="custAddr" placeholder="Address"></div>
<div><label>CNIC:</label><input id="custCNIC" placeholder="CNIC"></div>
</div>
</div>

<div class="box"><h2>Product Entry / Sale</h2>
<div class="row">
<div><label>Product</label><select id="saleProd"></select></div>
<div><label>Qty</label><input id="saleQty" type="number" placeholder="Qty"></div>
<div><label>Bon</label><input id="saleBon" placeholder="Bon"></div>
<div><label>Batch No</label><input id="saleBatch" placeholder="Batch No"></div>
</div>
<div class="row">
<div><label>Expiry Date</label><input id="saleExp" type="date"></div>
<div><label>TP</label><input id="saleTP" type="number" placeholder="TP"></div>
<div><label>Dist Disc %</label><input id="saleDisc" type="number" placeholder="Dist Disc %"></div>
</div>
<!-- GST % REMOVED AS PER INSTRUCTION -->
<button class="btn g" onclick="addItem()">+ Add Item</button>
<button class="btn g2" onclick="addNewProduct()">+ New Product Entry</button>
</div>

<div class="box">
<button class="btn g" onclick="saveInvoice()">Save Invoice</button>
<button class="btn g2" onclick="viewInvoice()">Invoice View</button>
<button class="btn o" onclick="window.print()">Print Invoice (A4)</button>
<button class="btn o" onclick="showInvoices()">Backup / Invoice List</button>
<button class="btn o" onclick="summary()">Summary Sheet</button>
</div>

<div class="box"><h2>Invoice Items</h2><table><thead><tr><th>#</th><th>Product</th><th>Qty</th><th>Batch No</th><th>Expiry</th><th>TP</th><th>Disc%</th><th>Total</th></tr></thead><tbody id="itemsBody"></tbody></table><h3 id="grandTotal">Total: 0</h3></div>

<div class="box"><h2>Stock Detail - Auto Calculate</h2><div id="stockList"></div><div id="invoiceList" style="margin-top:15px"></div></div>

</div>
<script>
let products=[
"1. Syrup-GM-APTI",
"2. Sachets-GM-BERRY",
"3. Syrup-GM-CAL",
"4. Tablet-GM-CAL",
"5. Syrup-GM-CID",
"6. Drops-GM-D",
"7. Syrup-GM-LEAF",
"8. Syrup-GM-VIT",
"9. Tablet-GM-VIT",
"10. Softgel-Thy-D Plus"
];
let stock={}; products.forEach(p=>stock[p]={total:1000,sale:0});
stock["1. Syrup-GM-APTI"].sale=10; stock["3. Syrup-GM-CAL"].sale=10;
let items=[]; let invoices=JSON.parse(localStorage.getItem('gmbInv')||'[]');
let savedProds=JSON.parse(localStorage.getItem('gmbProds')||'null'); if(savedProds){products=savedProds; products.forEach(p=>{if(!stock[p])stock[p]={total:1000,sale:0}})}
function fillSelects(){let h=products.map(p=>`<option>${p}</option>`).join(''); document.getElementById('stockProd').innerHTML=h; document.getElementById('saleProd').innerHTML=h; renderStock();}
function renderStock(){document.getElementById('stockList').innerHTML=products.map((p,i)=>{let s=stock[p]; return `<div class="stock-item"><span>${i+1}. ${p} - Total: ${s.total} | Sale: ${s.sale} | Balance: ${s.total-s.sale}</span><button onclick="editStockItem('${p}')">Edit</button></div>`}).join('');}
function editStockItem(p){let q=prompt('New Total Stock for '+p,stock[p].total); if(q!==null){stock[p].total=parseInt(q)||0; renderStock();}}
function addStock(){let p=document.getElementById('stockProd').value; let q=parseInt(document.getElementById('stockQty').value||0); stock[p].total+=q; renderStock(); alert('Stock Added');}
function editStock(){let p=document.getElementById('stockProd').value; editStockItem(p);}
function addItem(){let p=document.getElementById('saleProd').value; let q=parseInt(document.getElementById('saleQty').value||0); let batch=document.getElementById('saleBatch').value; let exp=document.getElementById('saleExp').value; let tp=parseFloat(document.getElementById('saleTP').value||0); let disc=parseFloat(document.getElementById('saleDisc').value||0); if(!q){alert('Qty likhein');return;} let total=q*tp*(1-disc/100); items.push({p,q,batch,exp,tp,disc,total}); stock[p].sale+=q; let tbody=document.getElementById('itemsBody'); tbody.innerHTML=items.map((it,i)=>`<tr><td>${i+1}</td><td>${it.p}</td><td>${it.q}</td><td>${it.batch}</td><td>${it.exp}</td><td>${it.tp}</td><td>${it.disc}</td><td>${it.total.toFixed(0)}</td></tr>`).join(''); document.getElementById('grandTotal').innerText='Total: '+items.reduce((a,b)=>a+b.total,0).toFixed(0); renderStock();}
function addNewProduct(){let form=prompt('Product Form likhein - Example: Syrup / Sachets / Tablet / Drops / Softgel','Syrup'); if(!form) return; let name=prompt('Product Name likhein - Example: GM-NEW','GM-'); if(!name) return; let full=(products.length+1)+'. '+form+'-'+name.toUpperCase(); products.push(full); stock[full]={total:0,sale:0}; localStorage.setItem('gmbProds',JSON.stringify(products)); fillSelects(); alert('New Product Added: '+full);}
function saveInvoice(){let inv={no:document.getElementById('invNo').value,date:document.getElementById('invDate').value,cust:document.getElementById('custName').value,items:items,total:items.reduce((a,b)=>a+b.total,0)}; invoices.push(inv); localStorage.setItem('gmbInv',JSON.stringify(invoices)); alert('Invoice Saved: '+inv.no); document.getElementById('invNo').value=String(parseInt(inv.no)+1).padStart(3,'0');}
function viewInvoice(){alert('Invoice: '+document.getElementById('invNo').value+'\nCustomer: '+document.getElementById('custName').value+'\nItems: '+items.length+'\nTotal: '+items.reduce((a,b)=>a+b.total,0));}
function showInvoices(){document.getElementById('invoiceList').innerHTML='<h3>Backup / Invoice List</h3>'+invoices.map(i=>`<div>${i.no} | ${i.date} | ${i.cust} | Rs.${i.total}</div>`).join('');}
function summary(){alert('Summary\nTotal Products: '+products.length+'\nTotal Invoices: '+invoices.length);}
fillSelects();
</script>
</body>
</html>
