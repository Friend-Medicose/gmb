<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GMB PHARMA KARACHI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff;overflow-x:hidden}
/* HEADER */
.header{background:#0a4eb5;color:#fff;padding:10px;text-align:center;font-weight:900;font-size:20px}
/* FIX 1 - HERO SLIDE SAB SE UPAR */
.hero{width:100%;height:380px;position:relative;overflow:hidden;background:#eaf2ff}
.hero-track{display:flex;width:300%;height:100%;animation:heroSlide 12s infinite}
.hero-track img{width:33.333%;height:100%;object-fit:cover}
@keyframes heroSlide{0%,30%{transform:translateX(0)}33%,63%{transform:translateX(-33.333%)}66%,96%{transform:translateX(-66.666%)}100%{transform:translateX(0)}}
/* FIX 2 - PEECHY WALI PATTI KHATAM - Is class ko display none kar diya */
.old-marquee-strip,.duplicate-strip,.behind-strip{display:none!important}
/* PRODUCTS SECTION */
h2{color:#0a4eb5;text-align:center;margin:18px 0;font-size:26px}
/* FIX 3 - PRODUCT SLIDES TEZ - pehle 45s thi, ab 15s */
.product-slider{overflow:hidden;white-space:nowrap;background:#fff;padding:10px 0;border-top:3px solid #0a4eb5;border-bottom:3px solid #0a4eb5}
.product-track{display:inline-flex;gap:15px;animation:prodSlide 15s linear infinite}
.product-track img{width:200px;height:140px;object-fit:cover;border:2px solid #ddd;border-radius:10px;flex-shrink:0}
@keyframes prodSlide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.product-track:hover{animation-play-state:paused}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;padding:15px}
.card{border:1px solid #ddd;border-radius:12px;padding:10px;text-align:center}
.card img{width:100%;height:150px;object-fit:cover;border-radius:8px}
.card b{color:#0a4eb5;display:block;margin-top:6px}
.footer{background:#0a4eb5;color:#fff;text-align:center;padding:15px;margin-top:10px}
@media(max-width:600px){.hero{height:220px}.products{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="header">GMB PHARMA KARACHI</div>

<!-- FIX 1: HERO SLIDE AB SAB SE UPAR HAI - Header ke foran neeche -->
<div class="hero">
<div class="hero-track">
<img src="https://gmb-pharma.github.io/gmb/images/banner1.jpg" onerror="this.src='https://via.placeholder.com/1200x380/0a4eb5/ffffff?text=GMB+PHARMA+1'">
<img src="https://gmb-pharma.github.io/gmb/images/banner2.jpg" onerror="this.src='https://via.placeholder.com/1200x380/1e90ff/ffffff?text=GMB+PHARMA+2'">
<img src="https://gmb-pharma.github.io/gmb/images/banner3.jpg" onerror="this.src='https://via.placeholder.com/1200x380/10b981/ffffff?text=GMB+PHARMA+3'">
</div>
</div>

<!-- FIX 2: PEECHY WALI PATTI DELETE KAR DI - Yahan pehle duplicate marquee thi, ab koi patti nahi hai -->

<!-- FIX 3: OUR PRODUCTS SLIDER - AB TEZ 15s -->
<h2>Our Products</h2>
<div class="product-slider">
<div class="product-track" id="prodTrack">
<img src="images/gm-apti.jpg" alt="GM-APTI"><img src="images/gm-berry.jpg" alt="GM-Berry"><img src="images/gm-cal.jpg" alt="GM-CAL"><img src="images/gm-cid.jpg" alt="GM-CID"><img src="images/gm-d.jpg" alt="GM-D"><img src="images/gm-leaf.jpg" alt="GM-LEAF"><img src="images/gm-vit.jpg" alt="GM-VIT">
<img src="images/gm-apti.jpg" alt="GM-APTI"><img src="images/gm-berry.jpg" alt="GM-Berry"><img src="images/gm-cal.jpg" alt="GM-CAL"><img src="images/gm-cid.jpg" alt="GM-CID"><img src="images/gm-d.jpg" alt="GM-D"><img src="images/gm-leaf.jpg" alt="GM-LEAF"><img src="images/gm-vit.jpg" alt="GM-VIT">
</div>
</div>

<div class="products">
<div class="card"><img src="images/gm-apti.jpg"><b>GM-APTI</b><small>120ml Syrup - Appetizer</small></div>
<div class="card"><img src="images/gm-berry.jpg"><b>GM-Berry</b><small>Cranberry Vitamin C</small></div>
<div class="card"><img src="images/gm-cal.jpg"><b>GM-CAL</b><small>Calcium & Vitamin D3</small></div>
<div class="card"><img src="images/gm-vit.jpg"><b>GM-VIT</b><small>Multivitamins+Minerals</small></div>
