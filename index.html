<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GMB PHARMA KARACHI PAKISTAN - Where good health begins</title>
<style>
body{font-family:Arial;margin:0;background:#fff5f0}
header{background:#fff;display:flex;align-items:center;gap:15px;padding:10px 25px;justify-content:space-between}
.logo-wrap{display:flex;align-items:center;gap:15px}
.logo-wrap img{height:65px;width:65px;object-fit:contain;border-radius:50%}
.logo-text h1{margin:0;color:#0b3d91;font-size:22px;letter-spacing:1px}
.logo-text p{margin:2px 0 0;color:#333;font-size:14px}
nav{font-size:15px}
.hero{position:relative;overflow:hidden}
.hero img{width:100%;display:block;object-fit:cover;object-position:bottom;height:480px}
.hero-bg{width:100%;display:block}
/* PATTI SLIDING */
.patti-wrap{overflow:hidden;background:#fff;padding:5px 0;white-space:nowrap}
.patti-track{display:inline-block;animation:slidePatti 15s linear infinite}
.patti-track img{height:140px;width:auto;display:inline-block}
@keyframes slidePatti{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
/* PRODUCTS */
h2{text-align:center;color:#0b3d91;font-size:28px;margin:25px 0 10px}
.slider{display:flex;overflow:hidden;gap:15px;padding:20px}
.product{min-width:180px;background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 8px #ddd}
.product img{width:100%;height:160px;object-fit:contain}
.product h3{color:#0b3d91;font-size:15px}
footer img{width:100%;display:block}
footer{background:#0b3d91;color:#fff;padding:15px;text-align:center}
</style>
</head>
<body>

<header>

<!-- BACKGROUND IMAGE - Faces ab clear nazar ayenge, upar text nahi hoga -->

<img src="images/background.jpg" alt="background">
</div>

<!-- MAIN DISPLAY - bina text overlap ke -->
<div class="hero">
<img src="images/main%20display.jpg" style="object-position:center;height:auto">
</div>

<!-- PATTI AB SLIDING ME CHALEGI -->
<div class="patti-wrap">
<div class="patti-track">
<img src="images/display%20ki%20patti.jpg">

  <div class="product"><img src="images/Thy-D%20plus.jpg"><h3>Thy-D Plus</h3></div>

<footer>

const s=document.getElementById('slider');
setInterval(()=>{ s.scrollLeft+=200; if(s.scrollLeft+s.clientWidth>=s.scrollWidth) s.scrollLeft=0; },2000);
</script>
</body>
</html>
