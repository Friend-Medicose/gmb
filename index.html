<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GMB PHARMA KARACHI PAKISTAN</title>
<style>
body{font-family:Arial;margin:0;background:#fff}
header{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 25px}
.logo-wrap{display:flex;align-items:center;gap:15px}
.logo-wrap img{height:65px;width:65px;object-fit:contain}
.logo-text h1{margin:0;color:#0b3d91;font-size:22px}
.logo-text p{margin:2px 0;color:#444;font-size:14px}

/* BACKGROUND - PORI IMAGE + WATERMARK LIGHT - Blue Patti Hata Di */
.hero{position:relative;background:#fff;text-align:center}
.hero img{width:100%;height:auto;display:block;object-fit:contain;opacity:0.28}

/* PATTI + SLIDE - Slide Ab Patti Ke UPAR Chalegi */
.patti-section{position:relative;width:100%;overflow:hidden;margin-top:-5px}
.patti-bg{width:100%;display:block}
.patti-slide{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;display:flex;align-items:center}
.patti-track{display:flex;animation:slidePatti 14s linear infinite;gap:0}
.patti-track img{height:130px;width:auto}
@keyframes slidePatti{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

h2{text-align:center;color:#0b3d91;font-size:28px;margin:20px 0 10px}
.slider{display:flex;overflow:hidden;gap:15px;padding:20px}
.product{min-width:180px;background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 8px #ddd}
.product img{width:100%;height:160px;object-fit:contain}
.product h3{color:#0b3d91;font-size:15px}
footer img{width:100%;display:block}
footer{background:#0b3d91;color:#fff;padding:15px;text-align:center}
</style>
</head>
<body>

<header>
<div class="logo-wrap">
<img src="images/logo.jpg">
<div class="logo-text">
<h1>GMB PHARMA KARACHI PAKISTAN</h1>
<p>Where good health begins</p>
</div>
</div>
<div>Home | Products | About | Contact</div>
</header>

<!-- BACKGROUND ONLY - Watermark Light, Pori Image, Faces Clear -->
<div class="hero">
<img src="images/background.jpg">
</div>

<!-- PATTI + SLIDE UPAR -->
<div class="patti-section">
<img class="patti-bg" src="images/display%20ki%20patti.jpg">
<div class="patti-slide">
<div class="patti-track">
<img src="images/display%20ki%20patti.jpg">
<img src="images/display%20ki%20patti.jpg">
</div>
</div>
</div>

<h2>Our Products</h2>

<div class="slider" id="slider">
  <div class="product"><img src="images/GM-APTI%20SYP.jpg"><h3>GM-APTI</h3></div>
  <div class="product"><img src="images/GM-Berry.jpg"><h3>GM-Berry</h3></div>
  <div class="product"><img src="images/GM-CAL%20SYP.jpg"><h3>GM-CAL SYP</h3></div>
  <div class="product"><img src="images/GM-CAL%20TAB.jpg"><h3>GM-CAL TAB</h3></div>
  <div class="product"><img src="images/GM-CID%20SYP.jpg"><h3>GM-CID</h3></div>
  <div class="product"><img src="images/GM-D%20DROPS.jpg"><h3>GM-D Drops</h3></div>
  <div class="product"><img src="images/GM-LEAF%20SYP.jpg"><h3>GM-LEAF</h3></div>
  <div class="product"><img src="images/GM-VIT%20SYP.jpg"><h3>GM-VIT SYP</h3></div>
  <div class="product"><img src="images/GM-VIT.jpg"><h3>GM-VIT TAB</h3></div>
  <div class="product"><img src="images/Thy-D%20plus.jpg"><h3>Thy-D Plus</h3></div>
</div>

<footer>
<img src="images/BOTTOM%20LINE.jpg">
<div>© 2026 GMB PHARMA KARACHI PAKISTAN | Where good health begins</div>
</footer>

<script>
const s=document.getElementById('slider');
setInterval(()=>{ s.scrollLeft+=200; if(s.scrollLeft+s.clientWidth>=s.scrollWidth) s.scrollLeft=0; },2000);
</script>
</body>
</html>
